name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME#v}" = "$package_version"
      - run: npm ci
      - run: npm test
      - run: npm run build:whisper:mac
      - run: npm run verify:whisper:mac
      - run: npm run build:renderer
      - name: Build, sign, and notarize
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never -c.forceCodeSigning=true
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify app, native runtime, and notarization
        shell: bash
        run: |
          app_path=""
          for candidate in release-v2/mac*/Inwise.app; do
            if [ -d "$candidate" ]; then
              app_path="$candidate"
              break
            fi
          done
          test -n "$app_path"
          whisper_path="$app_path/Contents/Resources/whisper/whisper-cli"
          manifest_path="$app_path/Contents/Resources/whisper/manifest.json"
          test -x "$whisper_path"
          test -f "$manifest_path"
          expected_arch='${{ matrix.arch }}'
          if [ "$expected_arch" = 'x64' ]; then expected_arch='x86_64'; fi
          test "$(lipo -archs "$whisper_path")" = "$expected_arch"
          "$whisper_path" --help >/dev/null
          node -e '
            const fs = require("node:fs");
            const [, manifestPath, expectedArch] = process.argv;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (manifest.platform !== "darwin" || manifest.arch !== expectedArch) process.exit(1);
          ' "$manifest_path" '${{ matrix.arch }}'
          unexpected_libraries="$(otool -L "$whisper_path" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/System/Library/|/usr/lib/)' || true)"
          test -z "$unexpected_libraries"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app_path/Contents/Info.plist")" = '13.0.0'
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app_path/Contents/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' "$app_path/Contents/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSScreenCaptureUsageDescription' "$app_path/Contents/Info.plist" >/dev/null
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$whisper_path"
          spctl --assess --type execute --verbose "$app_path"
          xcrun stapler validate "$app_path"
      - name: Smoke-test packaged app
        shell: bash
        run: |
          app_path=""
          for candidate in release-v2/mac*/Inwise.app; do
            if [ -d "$candidate" ]; then
              app_path="$candidate"
              break
            fi
          done
          test -n "$app_path"
          smoke_dir="$RUNNER_TEMP/inwise-smoke-${{ matrix.arch }}"
          mkdir -p "$smoke_dir/store" "$smoke_dir/profile"
          INWISE_STORE_DIR="$smoke_dir/store" \
            "$app_path/Contents/MacOS/Inwise" \
            --user-data-dir="$smoke_dir/profile" --hidden \
            >"$smoke_dir/app.log" 2>&1 &
          app_pid=$!
          cleanup() {
            if kill -0 "$app_pid" 2>/dev/null; then kill "$app_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          sleep 10
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$smoke_dir/app.log"
            wait "$app_pid" || true
            exit 1
          fi
          echo "PACKAGED_APP_HEALTHY arch=${{ matrix.arch }} pid=$app_pid"
      - uses: actions/upload-artifact@v4
        with:
          name: Inwise-mac-${{ matrix.arch }}
          path: |
            release-v2/Inwise-*-mac-${{ matrix.arch }}.dmg
            release-v2/Inwise-*-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Inwise-mac-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
