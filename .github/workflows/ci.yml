name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, 'codex/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x64
            platform: windows
            target_arch: x64
          - runner: macos-15
            label: macos-arm64
            platform: macos
            target_arch: arm64
          - runner: macos-15-intel
            label: macos-x64
            platform: macos
            target_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:renderer
      - name: Package unsigned Windows installer
        if: matrix.platform == 'windows'
        run: npx electron-builder --win --${{ matrix.target_arch }} --publish never
      - name: Upload unsigned Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Inwise-${{ matrix.label }}-unsigned
          path: |
            release-v2/Inwise-Setup-*.exe
            release-v2/Inwise-Setup-*.exe.blockmap
          if-no-files-found: error
          retention-days: 7
      - name: Build and verify native Whisper runtime
        if: matrix.platform == 'macos'
        run: |
          npm run build:whisper:mac
          npm run verify:whisper:mac
          npm run smoke:whisper:mac
      - name: Package unsigned Mac installers
        if: matrix.platform == 'macos'
        run: npx electron-builder --mac --${{ matrix.target_arch }} --publish never -c.mac.notarize=false -c.forceCodeSigning=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged Mac runtime and startup
        if: matrix.platform == 'macos'
        run: npm run verify:package:mac
        env:
          INWISE_EXPECTED_ARCH: ${{ matrix.target_arch }}
      - name: Upload unsigned Mac installers
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: Inwise-${{ matrix.label }}-unsigned
          path: |
            release-v2/Inwise-*-mac-${{ matrix.target_arch }}.dmg
            release-v2/Inwise-*-mac-${{ matrix.target_arch }}.zip
          if-no-files-found: error
          retention-days: 7
