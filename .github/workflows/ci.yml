name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x64
            platform: windows
            target_arch: x64
          - runner: macos-15
            label: macos-arm64
            platform: macos
            target_arch: arm64
          - runner: macos-15-intel
            label: macos-x64
            platform: macos
            target_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:renderer
      - name: Build and verify native Whisper runtime
        if: matrix.platform == 'macos'
        run: |
          npm run build:whisper:mac
          npm run verify:whisper:mac
          npm run smoke:whisper:mac
      - name: Package unsigned Mac app
        if: matrix.platform == 'macos'
        run: npx electron-builder --mac --${{ matrix.target_arch }} --dir --publish never -c.mac.notarize=false -c.forceCodeSigning=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged Mac runtime and startup
        if: matrix.platform == 'macos'
        run: npm run verify:package:mac
        env:
          INWISE_EXPECTED_ARCH: ${{ matrix.target_arch }}
